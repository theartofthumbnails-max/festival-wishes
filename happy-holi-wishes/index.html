<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Day Special Surprise 🇮🇳</title>
    <!-- External Libraries for Effects -->
    <script src="https://cdn.jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
    
    <style>
        :root { --saffron: #FF9933; --white: #FFFFFF; --green: #138808; --navy: #000080; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }

        /* Floating Emoji Background Animation */
        .emoji-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .emoji { position: absolute; animation: float 10s infinite linear; opacity: 0.3; }
        @keyframes float { 
            0% { transform: translateY(110vh) rotate(0deg); } 
            100% { transform: translateY(-10vh) rotate(360deg); } 
        }

        .card { 
            background: rgba(255, 255, 255, 0.95); 
            width: 90%; max-width: 450px; 
            padding: 25px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center; border: 5px solid var(--navy);
            position: relative;
        }

        #timer-container { background: var(--navy); color: #FFD700; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .holiday-title { font-size: 1.8rem; color: var(--navy); margin-bottom: 10px; text-transform: uppercase; }
        .chakra { width: 80px; animation: spin 10s linear infinite; margin: 15px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        input, select { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid var(--saffron); border-radius: 10px; font-weight: bold; }
        
        .main-btn { background: #e67e22; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.2rem; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; box-shadow: 0 5px 0 #a35d1a; transition: 0.2s; }
        .main-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a35d1a; }

        .share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; display: none; }
        .share-icon { font-size: 1.5rem; padding: 10px; border-radius: 10px; color: white; text-decoration: none; }
        .wa { background: #25D366; } .fb { background: #1877F2; } .tw { background: #1DA1F2; } .tg { background: #0088cc; }

        #wishDisplay { display: none; background: #f9f9f9; padding: 15px; border-radius: 10px; border-left: 5px solid var(--green); margin-top: 20px; font-size: 1.1rem; color: #333; text-align: left; }
        .recreate-btn { display: none; margin-top: 20px; font-size: 0.9rem; color: var(--navy); text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<div class="emoji-bg" id="emojiBg"></div>

<div class="card animate__animated animate__zoomIn">
    <div id="timer-container">
        <span id="holiday-label">Countdown</span>: <span id="evergreen-timer">00:00:00:00</span>
    </div>

    <h1 id="holiday-name" class="holiday-title">Independence Day</h1>
    <img src="https://upload.wikimedia.org" class="chakra">

    <div id="setup-form">
        <input type="text" id="userName" placeholder="अपना नाम लिखें (Your Name)" required>
        <input type="text" id="friendName" placeholder="दोस्त का नाम (Friend Name)">
        <select id="city">
            <option>Muzaffarnagar</option>
            <option>Meerut</option>
            <option>Delhi</option>
            <option>Mumbai</option>
        </select>
        <button class="main-btn" onclick="processWish()">CREATE MAGIC WISH ✨</button>
    </div>

    <div id="wishDisplay" class="animate__animated animate__fadeIn"></div>
    
    <div class="share-grid" id="shareBox">
        <a href="#" id="waBtn" class="share-icon wa"><i class="fab fa-whatsapp"></i></a>
        <a href="#" id="fbBtn" class="share-icon fb"><i class="fab fa-facebook"></i></a>
        <a href="#" id="tgBtn" class="share-icon tg"><i class="fab fa-telegram"></i></a>
        <a href="#" id="twBtn" class="share-icon tw"><i class="fab fa-twitter"></i></a>
    </div>

    <a href="https://business.skmstudio.com" id="giftLink" style="display:block; margin-top:15px; color:var(--green); font-weight:bold;">🎁 Click for National Gift</a>
    
    <div id="recreate" class="recreate-btn" onclick="location.reload()">Want to create your own? Click here!</div>
</div>

<script>
    // 1. Dynamic Holiday & Timer Logic
    const config = {
        rep: { name: "Republic Day", date: "Jan 26,", month: 0 },
        ind: { name: "Independence Day", date: "Aug 15,", month: 7 }
    };

    function getNextHoliday() {
        const now = new Date();
        const year = now.getFullYear();
        let repDate = new Date(`Jan 26, ${year} 00:00:00`);
        let indDate = new Date(`Aug 15, ${year} 00:00:00`);
        
        if (now > indDate) {
            repDate.setFullYear(year + 1);
            return { ...config.rep, target: repDate };
        } else if (now > repDate) {
            return { ...config.ind, target: indDate };
        } else {
            return { ...config.rep, target: repDate };
        }
    }

    const activeHoliday = getNextHoliday();
    document.getElementById('holiday-name').innerText = activeHoliday.name;
    document.getElementById('holiday-label').innerText = activeHoliday.name;

    // 2. Evergreen Timer Implementation
    function updateTimer() {
        const now = new Date().getTime();
        const distance = activeHoliday.target - now;

        if (distance < 0) {
            document.getElementById('evergreen-timer').innerText = "LIVE NOW! 🇮🇳";
            triggerConfetti();
        } else {
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById('evergreen-timer').innerText = `${d}d ${h}h ${m}m ${s}s`;
        }
    }
    setInterval(updateTimer, 1000);

    // 3. Background Emojis
    const emojiContainer = document.getElementById('emojiBg');
    const emojis = ['🇮🇳', '🧡', '🤍', '💚', '🪁', '✨'];
    for(let i=0; i<20; i++) {
        let e = document.createElement('div');
        e.className = 'emoji';
        e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
        e.style.left = Math.random() * 100 + 'vw';
        e.style.animationDelay = Math.random() * 5 + 's';
        e.style.fontSize = (Math.random() * 20 + 20) + 'px';
        emojiContainer.appendChild(e);
    }

    // 4. Wish Generation & Sharing
    function processWish() {
        const uName = document.getElementById('userName').value;
        const fName = document.getElementById('friendName').value || "Friends";
        const city = document.getElementById('city').value;
        
        if(!uName) return alert("Please enter your name!");

        const msg = `🌟 *Jai Hind from ${uName}!* 🌟\n\nइस ${activeHoliday.name} पर ${uName} और उनके परिवार की ओर से आपको गर्मजोशी भरी शुभकामनाएं! 🇮🇳\n\n🚩 *${city}* के हर व्यवसायी को सलाम! 🙏\n\nCheck your surprise gift here:\n👉 ${window.location.href}\n\nSupport Local → Jai Hind!`;
        
        document.getElementById('setup-form').style.display = 'none';
        const display = document.getElementById('wishDisplay');
        display.style.display = 'block';
        display.innerText = msg;
        
        document.getElementById('shareBox').style.display = 'grid';
        document.getElementById('recreate').style.display = 'block';
        
        // Update Social Links
        const encodedMsg = encodeURIComponent(msg);
        document.getElementById('waBtn').href = `https://api.whatsapp.com{encodedMsg}`;
        document.getElementById('fbBtn').href = `https://www.facebook.com{window.location.href}`;
        document.getElementById('tgBtn').href = `https://t.me{window.location.href}&text=${encodedMsg}`;
        
        triggerConfetti();
    }

    function triggerConfetti() {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#FF9933', '#ffffff', '#138808'] });
    }
</script>
</body>
</html>
