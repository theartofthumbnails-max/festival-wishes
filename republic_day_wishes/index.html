        @keyframes spin {
            from {

            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Countdown Timer */
        #countdown-timer {
            position: sticky;
            top: 10px;
            width: fit-content;
            background: rgba(255, 255, 255, 0.98);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);

            font-weight: bold;
            color: #000080;

            text-align: center;

        }

        #countdown-timer .timer-label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        #countdown-timer .timer-value {
            display: block;
            font-size: 1.3rem;
            font-weight: 900;
            color: #FF9933;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        #countdown-timer.fade-out {
            animation: fadeOut 5s ease-in-out forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                display: none;
            }
        }

        .sender-label {
            display: block;

            color: #000080;
            margin-top: 20px;
            margin-bottom: 10px;

            color: #FF6B35;
            padding: 15px 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            animation: popBounce 2s ease-in-out infinite;
            position: relative;
            border: 3px solid #FF9933;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .sender-name::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            border-radius: 15px;
            z-index: -1;
            opacity: 0.3;
        }


        @keyframes popBounce {

            0%,
            100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.08);
            }

            50% {
                transform: scale(1.03);
            }

            75% {

<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; font-family: sans-serif;">

    <script>
        // Translations
        const translations = {
            en: { title: "Happy Republic Day", msg: "Celebrating the Spirit of India" },
            hi: { title: "गणतंत्र दिवस की शुभकामनाएं", msg: "भारत की भावना का जश्न" },
            bn: { title: "শুভ প্রজাতন্ত্র দিবস", msg: "ভারতের চেতনা উদযাপন" },
            ta: { title: "இனிய குடியரசு தின நல்வாழ்த்துக்கள்", msg: "இந்தியாவின் உணர்வை கொண்டாடுவோம்" },
            te: { title: "గణతంత్ర దినోత్సవ శుభాకాంక్షలు", msg: "భారతీయ స్ఫూర్తిని జరుపుకుందాం" },
            mr: { title: "प्रजासत्ताक दिनाच्या हार्दिक शुभेच्छा", msg: "भारताच्या चैतन्याचा उत्सव" },
            gu: { title: "પ્રજાસત્તાક દિવસની શુભકામનાઓ", msg: "ભારતની ભાવનાની ઉજવણી" },
            kn: { title: "ಗಣರಾಜ್ಯೋತ್ಸವದ ಶುಭಾಶಯಗಳು", msg: "ಭಾರತದ ಚೇತನದ ಸಂಭ್ರಮ" },
            ml: { title: "റിപ്പബ്ലിക് ദിന ആശംസകൾ", msg: "ഇന്ത്യയുടെ ചൈതന്യം ആഘോഷിക്കുന്നു" },
            pa: { title: "ਗਣਤੰਤਰ ਦਿਵਸ ਦੀਆਂ ਮੁਬਾਰਕਾਂ", msg: "ਭਾਰਤ ਦੀ ਭਾਵਨਾ ਦਾ ਜਸ਼ਨ" },
            or: { title: "ସାଧାରଣତନ୍ତ୍ର ଦିବସର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା", msg: "ଭାରତର ଆତ୍ମାକୁ ପାଳନ କରିବା" }
        };

        // Countdown Timer Logic
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); // 0-indexed (0 = January)
            const currentDate = now.getDate();

            // Check if today is January 26
            if (currentMonth === 0 && currentDate === 26) {
                // It's Republic Day - hide timer and add fade-out class
                const timer = document.getElementById('countdown-timer');
                timer.classList.add('fade-out');
                setTimeout(() => {
                    timer.style.display = 'none';
                }, 5000); // Hide after 5 seconds
                return;
            }

            // Calculate next Republic Day
            let nextRepublicDay;
            if (currentMonth === 0 && currentDate < 26) {
                // Before Jan 26 this year
                nextRepublicDay = new Date(currentYear, 0, 26);
            } else {
                // After Jan 26, so next year
                nextRepublicDay = new Date(currentYear + 1, 0, 26);
            }

            const timeLeft = nextRepublicDay - now;

            if (timeLeft <= 0) {
                document.getElementById('countdown-timer').style.display = 'none';
                return;
            }

            // Calculate days, hours, minutes, seconds
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            // Format with leading zeros for minutes and seconds
            const formattedMinutes = String(minutes).padStart(2, '0');
            const formattedSeconds = String(seconds).padStart(2, '0');

            // Display countdown with improved styling
            const timerEl = document.getElementById('countdown-timer');
            timerEl.innerHTML = `
                <span class="timer-label">⏰ Next Republic Day in</span>
                <span class="timer-value">${days} Days, ${hours} H, ${formattedMinutes} M, ${formattedSeconds} S</span>
            `;
            timerEl.style.display = 'block';
        }

        // Update countdown every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Multi-language Logic
        const langSelect = document.getElementById('language-select');
        const greetingEl = document.getElementById('greeting');
        const subMessageEl = document.getElementById('sub-message');

        langSelect.addEventListener('change', (e) => {
            const lang = e.target.value;
            const text = translations[lang] || translations['en'];
            greetingEl.textContent = text.title;
            subMessageEl.textContent = text.msg;
        });

        // WhatsApp Share Logic
        function shareOnWhatsApp() {
            const name = document.getElementById('sender-name').value;
            if (!name) {
                alert("Please enter your name first!");
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?from=${encodeURIComponent(name)}&lang=${langSelect.value}`;
            const message = `Happy Republic Day wish from ${name}: ${shareUrl}`;

            // Using WhatsApp API
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;

            window.open(whatsappUrl, '_blank');

            // Trigger confetti on successful share
            triggerConfetti();
        }

        // Download Wish as Image
        async function downloadWish() {
            const element = document.querySelector('.container');
            const downloadBtn = event.target;
            downloadBtn.textContent = '⏳ Creating image...';
            downloadBtn.disabled = true;

            try {
                const canvas = await html2canvas(element, {
                    backgroundColor: null,
                    scale: 2,
                    logging: false
                });

                const link = document.createElement('a');
                const name = document.getElementById('sender-name').value || 'republic-day';
                link.download = `${name}-republic-day-wish.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                downloadBtn.textContent = '✅ Downloaded!';
                triggerConfetti();

                setTimeout(() => {
                    downloadBtn.textContent = '📸 Download as Image';
                    downloadBtn.disabled = false;
                }, 2000);
            } catch (error) {
                downloadBtn.textContent = '❌ Error - Try again';
                setTimeout(() => {
                    downloadBtn.textContent = '📸 Download as Image';
                    downloadBtn.disabled = false;
                }, 2000);
            }
        }

        // Trigger Confetti Animation
        function triggerConfetti() {
            if (typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#FF9933', '#FFFFFF', '#138808', '#000080']
                });
            }
        }

        // Social Share Logic
        function shareSocial(platform) {
            const name = document.getElementById('sender-name').value;
            if (!name) {
                alert("Please enter your name first!");
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?from=${encodeURIComponent(name)}&lang=${langSelect.value}`;
            const message = `Check out this Republic Day wish from ${name}: ${shareUrl}`;

            let url = '';

            switch (platform) {
                case 'copy':
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        alert('Link copied to clipboard!');
                    }).catch(() => {
                        alert('Failed to copy. Please copy manually: ' + shareUrl);
                    });
                    return;

                case 'facebook':
                    // Facebook Share Dialog - works better than sharer.php
                    url = `https://www.facebook.com/dialog/share?app_id=YOUR_APP_ID&href=${encodeURIComponent(shareUrl)}&quote=${encodeURIComponent(message)}&display=popup&redirect_uri=${encodeURIComponent(shareUrl)}`;
                    // Alternative that works without app_id:
                    url = `https://www.facebook.com/sharer.php?u=${encodeURIComponent(shareUrl)}&quote=${encodeURIComponent(message)}`;
                    break;

                case 'instagram':
                    // Instagram doesn't support web share with prefilled text, so copy and open DMs
                    navigator.clipboard.writeText(message).then(() => {
                        alert('Message copied! Paste it in Instagram Direct.');
                        window.open('https://www.instagram.com/direct/inbox/', '_blank');
                    });
                    return;

                case 'linkedin':
                    // LinkedIn Share - correct format
                    url = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;
                    // Alternative with summary (may not work on all versions):
                    // url = `https://www.linkedin.com/shareArticle?mini=true&url=${encodeURIComponent(shareUrl)}&title=${encodeURIComponent('Happy Republic Day')}&summary=${encodeURIComponent(message)}`;
                    break;

                case 'telegram':
                    url = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(message)}`;
                    break;

                case 'twitter':
                    url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}&url=${encodeURIComponent(shareUrl)}`;
                    break;
            }

            if (url) {
                window.open(url, '_blank');
                triggerConfetti(); // Celebrate sharing!
            }
        }

        // Check URL Parameters on Load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fromName = urlParams.get('from');
            const lang = urlParams.get('lang');

            if (lang && translations[lang]) {
                langSelect.value = lang;
                const text = translations[lang];
                greetingEl.textContent = text.title;
                subMessageEl.textContent = text.msg;
            }

            if (fromName) {
                const senderEl = document.getElementById('sender-message');
                const senderNameEl = document.getElementById('sender-name-display');
                senderNameEl.textContent = fromName;
                senderEl.style.display = 'block';
            }
        });

        // Toggle Controls
        function toggleControls() {
            const controls = document.getElementById('controls-box');
            if (controls.style.display === 'none' || controls.style.display === '') {
                controls.style.display = 'block';
                controls.scrollIntoView({ behavior: 'smooth' });
            } else {
                controls.style.display = 'none';
            }
        }

        // Fireworks Animation
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;

        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 6,
                    y: (Math.random() - 0.5) * 6
                };
                this.alpha = 1;
                this.decay = 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }

        let particles = [];
        const colors = ['#FF9933', '#FFFFFF', '#138808', '#000080']; // Saffron, White, Green, Navy Blue

        function createFirework(x, y) {
            for (let i = 0; i < 30; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.clearRect(0, 0, width, height);

            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });

            if (Math.random() < 0.05) {
                createFirework(Math.random() * width, Math.random() * height);
            }
        }

        animate();

        // Add click listener for interaction
        window.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
        });
    </script>
